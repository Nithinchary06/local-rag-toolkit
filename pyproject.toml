[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "local-rag-toolkit"
version = "0.1.0"
description = "A small, local-first Python toolkit for document retrieval and grounded RAG answers."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "LocalRAG contributors" }]
keywords = ["rag", "retrieval-augmented-generation", "nlp", "ollama", "local-ai"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = ["scikit-learn>=1.3,<2.0", "pypdf>=4.0,<7.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5"]

[project.scripts]
localrag = "localrag.cli:main"

[project.urls]
Homepage = "https://github.com/Nithinchary06/local-rag-toolkit"
Repository = "https://github.com/Nithinchary06/local-rag-toolkit"
Issues = "https://github.com/Nithinchary06/local-rag-toolkit/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
